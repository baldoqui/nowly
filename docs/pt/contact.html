<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nowly - Notícias curtas escritas por IA</title>
  <meta name="description" content="Notícias curtas escritas por IA, com links para as fontes. Disponível em português e inglês.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700&display=swap">
  <link rel="stylesheet" href="/style.css" />
  <script>
    // Apply the saved or preferred theme before the page paints.
    document.documentElement.dataset.theme =
      localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1432199186754194"
     crossorigin="anonymous"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <a href="/pt/" class="logo" aria-label="nowly">
        <svg class="logo-mark" width="24" height="24" viewBox="0 0 48 48" aria-hidden="true"><path d="M10 42V22a14 14 0 0 1 28 0v6" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><circle class="logo-dot" cx="38" cy="40" r="5"/></svg>
        <span class="logo-word">nowly</span>
      </a>
      <nav class="header-actions">
        <div class="lang-switch" role="group" aria-label="Idioma">
          <a href="/en/" lang="en" >EN</a>
          <a href="/pt/" lang="pt" aria-current="page">PT</a>
        </div>
        <button id="theme-toggle" class="theme-btn" type="button" aria-label="Alternar tema"
          data-label-dark="Mudar para o tema escuro" data-label-light="Mudar para o tema claro"></button>
      </nav>
    </div>
  </header>


  <main id="content" class="container container--narrow page">
    <h2>Contato</h2>
    <p>Se você tiver alguma dúvida, feedback ou pergunta, sinta-se à vontade para entrar em contato.</p>
    <p>Você pode nos contatar por e-mail: <a href="mailto:contact@now-ly.com">contact@now-ly.com</a></p>
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <p>Estas notícias são escritas por IA e podem conter erros.</p>
      <nav class="footer-nav">
        <a href="/pt/about">Sobre</a>
        <a href="/pt/privacy">Política de Privacidade</a>
        <a href="/pt/contact">Contato</a>
      </nav>
    </div>
  </footer>

  <script src="/main.js"></script>
</body>
</html>
